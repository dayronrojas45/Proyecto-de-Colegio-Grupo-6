# Puerto del servidor
server.port=8080

# Configuración de H2 (BBDD en memoria)
spring.datasource.url=jdbc:h2:mem:cibertecdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuraci\u00F3n de MyQSL
#spring.datasource.url=jdbc:mysql://localhost:3306/avansys_colegio?useSSL=false&serverTimezone=America/Lima
#spring.datasource.username=root
#spring.datasource.password=mysql

# Configuración de JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración JPA / Hibernate avanzados
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.internal.NoCachingRegionFactory
